allowBuilds:
  # Convex bundles with esbuild; eslint's resolver needs its native binding.
  dtrace-provider: true
  esbuild: true
  # Downloads its ffmpeg binary on install; scripts/videos/extract-frames.ts decodes with it.
  ffmpeg-static: true
  unrs-resolver: true
# Security fixes Dependabot reported in transitive deps whose parents pin an exact vulnerable
# version (eas-cli, @ai-sdk/provider-utils) or lag behind the patch (postcss, vitest). Each lifts
# only within the same major. Drop an entry once `pnpm why <name>` shows no version below it.
overrides:
  joi@<17.13.8: ^17.13.8
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  undici@>=7.0.0 <7.29.1: ^7.29.1
  vite@>=8.2.0 <8.2.4: ^8.2.4
# The native fingerprint (the runtime version) hashes the paths of autolinked modules under
# node_modules/.pnpm. pnpm truncates those folder names at 60 characters on Windows and 120
# elsewhere, so a build started from Windows disagreed with the runtime version EAS computed on
# macOS, and EAS refused the build. Pinning the Windows length makes every machine agree.
virtualStoreDirMaxLength: 60
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.13
  - expo-dev-launcher@57.0.13
  - expo-dev-menu@57.0.13
  - expo-splash-screen@57.0.7
  - expo-constants@57.0.12
  - expo-notifications@57.0.12
  - expo-image-picker@57.0.11
  - expo-updates@57.0.15
patchedDependencies:
  # Pressability drops a press whose measured region is stale (a pinned sticky header on
  # Fabric Android). Drop once React Native ships the fix: react/react-native#57502.
  react-native@0.86.2: patches/react-native@0.86.2.patch
  # A form sheet resized twice within one resize animation (fitToContents on Android) cancelled
  # the first mid-flight and settled at its transient translationY: the sheet stuck low or
  # off-screen. The patch ends the interrupted animation instead, so it lands first.
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch
  # Reopened from Android's Recents, the app is relaunched with the intent that first created it,
  # so a share already imported opened the share sheet again. The patch ignores a relaunch from
  # history. Drop once expo-share-intent checks FLAG_ACTIVITY_LAUNCHED_FROM_HISTORY itself.
  expo-share-intent@8.0.1: patches/expo-share-intent@8.0.1.patch
