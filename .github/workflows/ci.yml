name: CI

on:
  # Branches only: a release pushes its v* tag with the commit main is already verifying, and a
  # tag never deploys, so a tag run re-checks the same tree for nothing.
  push:
    branches: ['**']
  pull_request:

# The repo is public, so anyone can open a pull request that runs this job. It only reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck + lint + C1/C2/C3 + tests. This runs from the first commit, on purpose:
      # every rule in AGENTS.md is only real because this job fails when it is broken.
      #
      # NOTE: this job has no Convex credentials, so it cannot run codegen. convex/_generated
      # is committed for exactly that reason — see .gitignore.
      - run: pnpm verify

  # A push to dev (preview) or main (production) that passed verify ships itself. Pull requests
  # and other branches stop above, and never see the secrets.
  deploy:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: write
    secrets:
      CONVEX_DEPLOY_KEY_DEV: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
      CONVEX_DEPLOY_KEY_PROD: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
