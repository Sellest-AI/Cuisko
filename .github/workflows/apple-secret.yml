name: Apple secret

# Keeps Sign in with Apple alive. Its client secret (`AUTH_APPLE_SECRET`) is a JWT Apple refuses
# past six months; this signs a fresh one on the 1st of every other month and sets it on both Convex
# deployments. Renewing every two months rather than just in time means a failed run (GitHub emails
# the failure) still leaves four months, and two more runs, before anyone's sign-in breaks.
#
# Secrets, all required:
#   APPLE_SIGN_IN_KEY       contents of the .p8 key (developer.apple.com → Keys); never in the repo
#   CONVEX_ENV_KEY_DEV      dev key carrying `deployment:env:write` only
#   CONVEX_ENV_KEY_PROD     prod key carrying `deployment:env:write` only
#
# Not deploy.yml's keys: those carry `deployment:deploy` alone, which cannot touch env, and widening
# them would let every deploy rewrite secrets. Each key here can set env and do nothing else.
#
# GitHub pauses scheduled workflows in a repository with no activity for 60 days; Actions shows a
# banner and the run can be re-enabled there. Run it by hand any time: Actions → Apple secret.

on:
  schedule:
    - cron: "0 5 1 */2 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sign the secret
        id: sign
        env:
          APPLE_SIGN_IN_KEY: ${{ secrets.APPLE_SIGN_IN_KEY }}
        run: |
          secret=$(node scripts/release/apple-client-secret.mjs)
          # Derived from a secret, so GitHub does not know to hide it: mask it before it goes anywhere.
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Set on dev
        run: npx convex env set AUTH_APPLE_SECRET "$SECRET"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_ENV_KEY_DEV }}
          SECRET: ${{ steps.sign.outputs.secret }}

      - name: Set on prod
        run: npx convex env set AUTH_APPLE_SECRET "$SECRET"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_ENV_KEY_PROD }}
          SECRET: ${{ steps.sign.outputs.secret }}
